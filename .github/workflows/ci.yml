name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check formatting
        run: zig fmt --check build.zig src tests
      - name: Unit tests
        run: zig build test --summary all
      - name: Hand-written integration tests
        run: zig build hand-written --summary all
      - name: Fixture conformance tests
        run: zig build fixtures --summary all
